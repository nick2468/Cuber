# Origin: London src-tauri/Cargo.toml, adapted: this app's names, and no plugin crates.
[package]
name = "cuber"
version = "1.1.0"
description = "Solves a Rubik's Cube from its colours"
authors = ["Nick"]
edition = "2021"
rust-version = "1.77.2"

[lib]
name = "cuber_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
# generate_context! expands to code that names these at the crate root.
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tauri = { version = "2", features = [] }
# No tauri-plugin-fs and no tauri-plugin-dialog: this app reads and writes no
# files. Everything it remembers is in localStorage, inside the window's own
# browser profile (spec 11.4).

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
panic = "abort"
strip = true
