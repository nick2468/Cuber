<!doctype html>
<html lang="en-AU">
  <head>
    <meta charset="UTF-8" />
    <!-- Origin: Conquest index.html, adapted: this app's title, name and theme colour. -->
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, viewport-fit=cover"
    />
    <title>Cuber</title>

    <!--
      The colour iPadOS paints around the app. The same value lives in two other
      places that cannot read this one: --ground in src/index.css, which is the
      palette's one home, and the manifest's background_color and theme_color in
      vite.config.ts. The meta is parsed before any CSS and the manifest is JSON
      written at build time, so neither can take a variable. A value that drifts
      here shows as a band of the wrong colour around the app.
    -->
    <meta name="theme-color" content="#16181c" />

    <!--
      These two make iPadOS open the Home Screen icon as an app, with no
      browser bars. The apple- prefixed one is the original; the plain one
      is the standard that replaced it. Both are needed for now.
    -->
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-title" content="Cuber" />

    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32.png" />
    <link rel="icon" type="image/svg+xml" href="/icon.svg" />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
